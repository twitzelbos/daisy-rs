[project]
name = "dsp-golden"
version = "0.1.0"
description = "numpy/scipy oracle that generates golden reference vectors for daisy-dsp primitives"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
dsp-golden = "dsp_golden.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsp_golden"]
