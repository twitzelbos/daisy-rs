[package]
name = "usb-enum-exerciser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone firmware: real usb-device CDC stack polled in a loop, recording its UsbDeviceState. Driven through USB enumeration (reset → SET_ADDRESS → SET_CONFIGURATION) by the STM32H7_OTG Renode model's host-stimulus hooks."

[dependencies]
cortex-m.workspace = true
