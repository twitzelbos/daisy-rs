[package]
name = "daisy-bsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Board support package for Daisy Seed and host boards (Patch, Field, Pod, custom carriers)"

# Modules that touch peripherals (clocks, led, ...) are target-gated so this
# crate also compiles on the host for `cargo test`. Pure-logic modules like
# `boot_check` live under [dependencies] with nothing MCU-specific.
[dependencies]

[target.'cfg(target_os = "none")'.dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
stm32h7xx-hal.workspace = true

[features]
default = ["seed"]
seed   = []
patch  = ["seed"]
field  = ["seed"]
pod    = ["seed"]
