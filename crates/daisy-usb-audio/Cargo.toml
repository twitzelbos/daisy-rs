[package]
name = "daisy-usb-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Daisy Seed USB composite device: CDC-ACM serial + UAC1 audio (stereo 48 kHz in AND out), simultaneously, over OTG2_HS FS."

[dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
stm32h7xx-hal.workspace = true
panic-halt.workspace = true
daisy-bsp.workspace = true
usb-device.workspace = true
usbd-serial.workspace = true
# dB → linear conversion for UAC volume control.
libm = "0.2"
daisy-audio = { workspace = true, optional = true }
# daisy-dsp cores, run in the loopback path by the `dsp-loop` feature.
daisy-dsp = { workspace = true, optional = true }
# The USB-MIDI class + the serial→USB-MIDI packetizer (used by the `pod` feature).
daisy-midi = { path = "../daisy-midi", features = ["usb"] }
ratatui-core = { version = "0.1", default-features = false, optional = true }
ratatui-serial = { path = "../ratatui-serial", optional = true }
embedded-alloc = { version = "0.6", optional = true }

[features]
# Skip USB bring-up so the XIP boot / pre_init can be verified under Renode,
# which has no OTG_HS model (UsbBus::new would spin on the core-reset poll).
renode_test = []
# Route USB audio to/from the on-board codec via daisy-audio (SAI1 + DMA)
# instead of the built-in loopback. HARDWARE-ONLY — see src/codec.rs for the
# clock hand-off, board-revision codec, and sample-rate-sync prerequisites.
codec = ["dep:daisy-audio"]
# Target the Daisy Seed 3 (TI TAC5242, hardware-strapped). Implies `codec` and
# selects the TAC5242 SAI config in daisy-audio. This is the USB-soundcard build.
seed3 = ["codec", "daisy-audio/seed3"]
# Target the original Daisy Seed (AKM AK4556, reset GPIO on PB11, no I2C).
# Implies `codec` and selects the AK4556 SAI config in daisy-audio. This is the
# DI-interface build for a Seed 1.0. Mutually exclusive with `seed3`.
ak4556 = ["codec", "daisy-audio/ak4556"]
# Drive a ratatui terminal UI over the USB-CDC serial (a host terminal is the
# display), with auto terminal-size detection. HARDWARE-ONLY (needs real USB).
tui = ["dep:ratatui-core", "dep:ratatui-serial", "dep:embedded-alloc"]
# Daisy Pod: read the hardware DIN MIDI-IN (USART1 RX = PB7, 31250 8N1) and
# forward it to the host over the USB-MIDI bulk IN. HARDWARE-ONLY (real UART +
# the bootloader's CoreClocks hand-off). Replaces the MIDI loopback with live
# input from the Pod's TRS/DIN jack.
pod = []
# Route the USB-audio loopback through a daisy-dsp core (currently a stereo
# biquad low-pass) so the DSP can be validated on real M7 silicon via its
# frequency response. HARDWARE-ONLY test build — see src/dsp_loop.rs and
# tools/usb-loopback/. Replaces the plain pass-through loopback.
dsp-loop = ["dep:daisy-dsp"]
