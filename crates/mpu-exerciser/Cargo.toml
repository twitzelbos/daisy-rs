[package]
name = "mpu-exerciser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone firmware that exercises the Cortex-M7 MPU across its ARMv7-M behaviours (AP permissions, XN, subregions, PRIVDEFENA background, region priority, MPU_TYPE, MMFSR/MMFAR) so Renode's MPU model can be verified against the ARM ARM."

[dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
panic-halt.workspace = true
