[package]
name = "pod-midi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Daisy Pod standalone USB-MIDI input: forwards the hardware DIN/TRS MIDI-IN (USART1 RX = PB7, 31250 8N1) to the host as a class-compliant USB-MIDI device."

[dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
panic-halt.workspace = true
daisy-bsp.workspace = true
usb-device.workspace = true
daisy-midi = { path = "../daisy-midi", features = ["usb"] }
