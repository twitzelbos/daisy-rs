[package]
name = "daisy-hothouse"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Daisy Seed (in a Cleveland Music Co. Hothouse pedal) XIP app: renders a live control panel — pots + toggle/footswitch state — as a ratatui TUI over USB-CDC serial."

[dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
stm32h7xx-hal.workspace = true
panic-halt.workspace = true
daisy-bsp.workspace = true
usb-device.workspace = true
usbd-serial.workspace = true
ratatui-core = { version = "0.1", default-features = false }
ratatui-serial = { path = "../ratatui-serial" }
embedded-alloc = "0.6"

[features]
# Skip USB bring-up so the XIP boot / pre_init can be verified under Renode,
# which has no OTG_HS model (UsbBus::new would spin on the core-reset poll).
renode_test = []
