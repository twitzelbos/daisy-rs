[package]
name = "cache-coherency-exerciser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone firmware that drives a D-cache/DMA coherency scenario so Renode's CacheCoherencyChecker can be verified: CPU caches a buffer, a foreign master overwrites it, then the CPU reads it with or without an invalidate."

[dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
panic-halt.workspace = true
