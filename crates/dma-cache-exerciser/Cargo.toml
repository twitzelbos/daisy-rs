[package]
name = "dma-cache-exerciser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone firmware that reproduces the M7 D-cache/DMA coherency hazard on HARDWARE using an on-chip DMA1 mem-to-mem transfer as the foreign master — the thing SWD cannot be (the debug port is cache-coherent). Runs the buggy and correct variant of both hazards back-to-back and records the read-back values to DTCM markers for a probe-rs read-out."

[dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
panic-halt.workspace = true
