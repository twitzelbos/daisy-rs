[package]
name = "fft-shootout"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone firmware that DWT-benchmarks competing real-FFT implementations head-to-head on the real Cortex-M7 (the authoritative ranking; Renode gives only a functional smoke). All-Rust competitors; CMSIS-DSP is opt-in behind the `cmsis` feature."

[dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
panic-halt.workspace = true
daisy-dsp = { path = "../daisy-dsp", version = "0.0.1" }
libm = "0.2"
# All-Rust reference FFT (radix-2, no_std, no alloc). size-2048 pulls the tables
# for every power-of-two size up to 2048.
microfft = { version = "0.6", default-features = false, features = ["size-2048"] }
