[package]
name = "daisy-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audio I/O driver for the Daisy Seed (SAI1 + AK4556/WM8731/PCM3060/TAC5242 codecs) with a block-based callback API"

[features]
# Target the Daisy Seed 3's hardware-strapped TI TAC5242 codec (SAI1 A=TX
# master / B=RX slave, 32-bit MSB, no I2C/reset). With the feature OFF, the
# build targets the three classic Seeds (AK4556 / WM8731 / PCM3060), auto-
# detected at runtime from the PD3/PD4 board-version straps.
seed3 = []

# The pure-logic `codec` module ([dependencies]) is host-testable; the SAI/DMA
# bring-up ([target] deps) is target-only, like daisy-bsp.
[dependencies]

[target.'cfg(target_os = "none")'.dependencies]
cortex-m.workspace = true
stm32h7xx-hal.workspace = true
daisy-bsp.workspace = true
